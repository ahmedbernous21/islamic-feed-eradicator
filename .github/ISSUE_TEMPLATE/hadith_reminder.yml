name: Suggest a hadith
description: Propose a hadith by its name or number. This issue is public.
labels: ["content:hadith", "moderation"]
body:
  - type: markdown
    attributes:
      value: |
        This issue is publicly visible. Name the collection or give the number. Do not include an email address.
  - type: input
    id: collection
    attributes:
      label: Name
      placeholder: Sahih al-Bukhari
    validations:
      required: true
  - type: input
    id: reference
    attributes:
      label: Number
      placeholder: "6114"
    validations:
      required: true
