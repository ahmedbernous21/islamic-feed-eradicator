name: Suggest a Qur'anic verse
description: Propose a verse by its name or number. This issue is public.
labels: ["content:quran", "moderation"]
body:
  - type: markdown
    attributes:
      value: |
        This issue is publicly visible. Name the surah or give the verse number. Do not include an email address.
  - type: input
    id: surah
    attributes:
      label: Name
      placeholder: Al-Baqarah
    validations:
      required: true
  - type: input
    id: verses
    attributes:
      label: Number
      placeholder: "2:255"
    validations:
      required: true
