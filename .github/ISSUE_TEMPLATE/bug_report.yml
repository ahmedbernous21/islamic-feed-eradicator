name: Bug report
description: A feed is still visible, something else was hidden, or the extension broke.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include account names, private messages, or browsing history. A site address and the steps are enough.
  - type: input
    id: site
    attributes:
      label: Website
      description: YouTube, Facebook, LinkedIn, or Instagram.
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page path
      description: For example `/`, `/watch`, `/feed`, or `/shorts/`.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What happened
      description: What you expected, and which region toggles were on.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: "1.0.0"
