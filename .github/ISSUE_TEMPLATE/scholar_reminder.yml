name: Suggest a scholar quotation
description: Propose a scholar's words and their meaning. This issue is public.
labels: ["content:scholar", "moderation"]
body:
  - type: markdown
    attributes:
      value: |
        This issue is publicly visible. Name the scholar and give the meaning of the quotation. Do not include an email address.
  - type: input
    id: scholar
    attributes:
      label: Scholar
    validations:
      required: true
  - type: input
    id: book
    attributes:
      label: Book
  - type: textarea
    id: translation
    attributes:
      label: Meaning
    validations:
      required: true
  - type: input
    id: source_url
    attributes:
      label: Link
      description: Optional.
